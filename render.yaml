services:
  - type: web
    name: telegram-task-agent
    runtime: docker
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEFAULT_TELEGRAM_CHAT_ID
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false